
services:
  Alias_site:
    image: python:3.12
    container_name: Alias_site
    working_dir: /app
    # ports:
    #   - "${PORT:-12836}:5454"
    environment:
      - ANALYTICS_URL=${ANALYTICS_URL:-}
      - ANALYTICS_UUID=${ANALYTICS_UUID:-}
    command: >
      /bin/bash -c "pip install -q -r requirements.txt && python main.py"
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - caddy

networks:
  caddy:
    external: true



